<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Gran Canaria 3D</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="ui-container">
    <div class="ui-header">
      <h2>Visor Climático GC</h2>
      <button id="btn-collapse" type="button" aria-label="Plegar menú" aria-expanded="true" aria-controls="ui-content">−</button>
    </div>
    <div id="ui-content">

    <div class="control-group">
      <button id="btn-datasource" class="toggle-btn">HISTÓRICO</button>
    </div>

    <div class="control-group buttons">
      <button id="btn-layer-weather" class="active">Clima</button>
      <button id="btn-layer-wind">Viento</button>
    </div>

    <div class="control-group date-group">
      <label for="date-picker">FECHA:</label>
      <input type="date" id="date-picker" value="2026-11-09">
    </div>

    <div id="timelapse-controls">
      <div class="control-group">
        <label for="time-slider">Hora actual: <span id="time-display" class="time-value">12:00</span></label>
        <input type="range" id="time-slider" min="0" max="23.99" value="12" step="0.01">
        <div class="time-range-labels">
          <span>00:00</span>
          <span>23:59</span>
        </div>
      </div>

      <div class="control-group buttons">
        <button id="btn-play">▶ Play</button>
        <button id="btn-speed">Vel: x1</button>
      </div>
    </div>

    <hr class="divider">

    <div class="control-group buttons">
      <button id="btn-thermal">Capa Térmica</button>
      <button id="btn-mode">Vista Estática</button>
    </div>

    <div class="control-group buttons" style="margin-top: 8px;">
      <button id="btn-labels">Nombres</button>
      <button id="btn-lines">Límites</button>
      <button id="btn-icons" class="active">Iconos</button>
    </div>

    <div id="thermal-legend" class="thermal-legend" role="img" aria-label="Escala de temperatura en grados Celsius" hidden>
      <div class="legend-title">°C</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>40°</span>
        <span>36°</span>
        <span>32°</span>
        <span>24°</span>
        <span>16°</span>
        <span>8°</span>
      </div>
    </div>
    <p class="data-note">El tamaño de las flechas de viento escala proporcionalmente según su velocidad en km/h.</p>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
