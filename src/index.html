<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Gran Canaria 3D</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="ui-container">
    <h2>Visor Climático GC</h2>
    
    <!-- Botón Modo Live / Histórico -->
    <div class="control-group">
      <button id="btn-datasource" class="toggle-btn">Modo: HISTÓRICO (CSV)</button>
    </div>

    <!-- Selector de Capa: Clima vs Viento -->
    <div class="control-group buttons">
      <button id="btn-layer-weather" class="active">🌦️ Clima</button>
      <button id="btn-layer-wind">💨 Viento</button>
    </div>

    <!-- Bloque de Histórico (Timelapse) -->
    <div id="timelapse-controls">
      <div class="control-group">
        <label for="date-picker">FECHA:</label>
        <input type="date" id="date-picker" value="2026-11-09">
        <button id="btn-today" type="button" style="margin-top: 6px;">Hoy · LIVE</button>
      </div>

      <div class="control-group">
        <label for="time-slider">Hora: <span id="time-display">12:00</span></label>
        <input type="range" id="time-slider" min="0" max="23.99" value="12" step="0.01">
      </div>

      <div class="control-group buttons">
        <button id="btn-play">▶ Play</button>
        <button id="btn-speed">Vel: x1</button>
      </div>
    </div>

    <hr class="divider">

    <!-- Botones de Acción Estáticos -->
    <div class="control-group buttons">
      <button id="btn-thermal">Capa Térmica</button>
      <button id="btn-mode">Vista 2D / 3D</button>
    </div>

    <div class="control-group buttons" style="margin-top: 8px;">
      <button id="btn-labels">🏷️ Nombres</button>
      <button id="btn-lines">Límites</button>
      <button id="btn-icons" class="active">Iconos</button>
    </div>

    <div id="thermal-legend" class="thermal-legend" style="display: none;">
      <div class="legend-title">°C</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>40°</span>
        <span>32°</span>
        <span>24°</span>
        <span>16°</span>
        <span>8°</span>
      </div>
    </div>
    <p class="data-note">En el histórico, municipios sin estación propia usan datos estimados de estaciones cercanas.</p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
